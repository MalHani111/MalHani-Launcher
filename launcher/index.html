<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
  <title>MalHani Launcher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tools.css">
</head>
<body>
  <div id="stage">
    <div id="art"><div class="wp"></div><div class="wp"></div></div>
    <div id="scrim"></div>

    <header id="clock" class="pill">
      <span id="wx"></span><span class="sep"></span><span id="date"></span><span class="sep"></span><span id="time"></span>
    </header>

    <section id="solat" aria-label="Waktu solat Semenyih">
      <div class="solat-heading"><div><h1>Waktu Solat</h1><p>Semenyih · Hulu Langat · SGR01</p></div><div id="solat-next">Memuatkan jadual…</div></div>
      <div id="solat-times"></div>
      <p id="solat-status">Sumber: JAKIM e-Solat · Waktu Malaysia</p>
    </section>

    <section id="home">
      <div id="dock">
        <div class="platter"><canvas class="frost"></canvas><canvas class="frost"></canvas><span class="tint"></span></div>
        <ul id="row"></ul>
      </div>
    </section>

    <div id="toast" class="pill"></div>
    <div id="veil"></div>
  </div>

  <!-- optional files: missing ones are simply skipped -->
  <script src="wallpapers/list.js"></script>
  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script src="art.js"></script>
  <script src="prayer.js"></script>
  <script src="welcome.js"></script>
  <script src="tools.js"></script>
  <script src="main.js"></script>
</body>
</html>
